<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick QR</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <div class="header-icon">
          <svg width="24" height="24" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="16" fill="#4285f4"/>
            <rect x="16" y="16" width="32" height="32" fill="white"/>
            <rect x="16" y="80" width="32" height="32" fill="white"/>
            <rect x="80" y="16" width="32" height="32" fill="white"/>
            <rect x="80" y="80" width="16" height="16" fill="white"/>
            <rect x="96" y="96" width="16" height="16" fill="white"/>
            <rect x="80" y="96" width="16" height="16" fill="white"/>
            <rect x="96" y="80" width="16" height="16" fill="white"/>
          </svg>
        </div>
        <h1 class="header-title">Quick QR</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="qr">QR Code</button>
      <button class="tab" data-tab="images">Page Images</button>
    </div>

    <div class="tab-content active" id="qrTab">
      <div class="qr-section">
        <div id="qrcode"></div>
        <div id="error" class="error hidden"></div>
        <div id="loading" class="loading hidden">Loading...</div>
      </div>
      <p class="helper-text">Scan with your phone to open this page</p>
    </div>

    <div class="tab-content" id="imagesTab">
      <div class="images-section">
        <div class="images-header">
          <span class="images-count" id="imagesCount">0 images found</span>
          <div class="header-actions">
            <button class="refresh-btn" id="refreshBtn" aria-label="Refresh images" title="Refresh images">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6"/>
                <path d="M1 20v-6h6"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
              </svg>
            </button>
            <button class="lazy-scan-btn" id="lazyScanBtn" aria-label="Scan for lazy images" title="Scan for lazy-loaded images (may scroll page)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="bulk-actions" id="bulkActions">
          <button class="bulk-btn" id="selectAllBtn">Select All</button>
          <button class="bulk-btn" id="deselectAllBtn">Deselect All</button>
          <span class="selected-count" id="selectedCount">0 selected</span>
          <button class="download-selected-btn" id="downloadSelectedBtn" disabled>Download Selected</button>
        </div>
        <div class="download-progress" id="downloadProgress" hidden>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">0 / 0 downloaded</div>
        </div>
        <div id="imagesGrid" class="images-grid"></div>
        <div id="imagesLoading" class="loading hidden">Discovering images...</div>
        <div id="imagesError" class="error hidden"></div>
        <div id="imagesEmpty" class="empty-state hidden">
          <div class="empty-state-icon">🖼️</div>
          <div class="empty-state-text">No images found on this page</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <a href="https://devxbd.com" target="_blank" rel="noopener noreferrer" class="brand-link">
        Made by DEVXBD
      </a>
    </footer>
  </div>

  <div class="modal" id="previewModal">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-content">
      <img class="modal-image" id="modalImage" src="" alt="Preview">
      <div class="modal-actions">
        <button class="modal-btn" id="modalCopy">Copy URL</button>
        <button class="modal-btn" id="modalDownload">Download</button>
        <button class="modal-btn" id="modalOpen">Open in Tab</button>
      </div>
    </div>
  </div>

  <script src="lib/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
